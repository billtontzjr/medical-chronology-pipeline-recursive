services:
  - type: web
    name: medical-chronology-pipeline
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: JEV_ENABLED
        value: "false"
      - key: JEV_MODEL
        value: jev-1.13.0
      - key: TEAM_PASSWORD
        sync: false
      - key: SESSION_DATA_DIR
        value: /app/data
      - key: REQUIRE_PERSISTENT_STORAGE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CLOUD_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: medical-data
      mountPath: /app/data
      sizeGB: 10

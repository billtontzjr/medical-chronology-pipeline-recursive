services:
  - type: web
    name: precision-chronology
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /_stcore/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_VISION_API_KEY
        sync: false
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
    # Persistent disk for session data (input PDFs, OCR text, extracted facts,
    # outputs). Without this disk, sessions live on the container's small
    # ephemeral root filesystem and the disk fills quickly under real workloads
    # (ENOSPC). The orchestrator also auto-prunes the oldest completed sessions
    # when usage tops 70%, so this size should comfortably hold months of work.
    # NOTE: Render does NOT resize an already-created disk when this value
    # changes — you must also grow it in the dashboard (Settings → Disks).
    # Medical/legal case folders run several GB each (input PDFs + OCR text +
    # extracted facts + outputs all live here), so size generously.
    # mountPath must match the live disk (/app/data). The app writes sessions
    # to /app/data/sessions, a subfolder of this mount. Do NOT change mountPath
    # on an existing service — Render recreates the disk and DESTROYS its data.
    disk:
      name: sessions
      mountPath: /app/data
      sizeGB: 50
